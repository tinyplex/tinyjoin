[package]
name = "tinygres-wasm-migration"
description = "Legacy snapshot migration WebAssembly bindings for TinyGres"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "tinygres_migration_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = "1"
serde_json = {version = "1", default-features = false, features = ["alloc"]}
serde-wasm-bindgen = "0.6"
tinygres-core = {path = "../tinygres-core"}
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
