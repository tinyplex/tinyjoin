[package]
name = "tinygres-wasm"
description = "WebAssembly bindings for the Tinygres engine"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
tinygres-core = {path = "../tinygres-core"}
wasm-bindgen = "0.2"
