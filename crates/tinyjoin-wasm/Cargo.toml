[package]
name = "tinyjoin-wasm"
description = "WebAssembly bindings for the TinyJoin engine"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
itoa = "1"
js-sys = "0.3"
serde_json = {version = "1", default-features = false, features = ["alloc"]}
tinyjoin-core = {path = "../tinyjoin-core", features = ["compact-storage-diagnostics"]}
wasm-bindgen = "0.2"
zmij = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  # Repeats the passes until the module stops shrinking: about 0.9 KB gzip for a few seconds.
  "--converge",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-simd",
]
