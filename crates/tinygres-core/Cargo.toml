[package]
name = "tinygres-core"
description = "The native-testable storage and query core for Tinygres"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sqlparser = {version = "0.62", default-features = false, features = ["std"]}

