[workspace]
members = [
  "crates/tinyjoin-core",
  "crates/tinyjoin-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/tinyplex/tinyjoin"
rust-version = "1.91"
version = "0.0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
